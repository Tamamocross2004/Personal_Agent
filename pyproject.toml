[project]
name = "personal-agent"
version = "0.4.0"
description = "从零手写的个人研究助理 Agent（不依赖 LangChain）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "rich>=13.7",
    "markdown-it-py>=2.2",
    # Windows 不自带 IANA 时区数据库，zoneinfo 需要这个包
    "tzdata; sys_platform == 'win32'",
    # 阶段 2：搜索与网页读取
    "ddgs>=9.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # 阶段 6：数据计算与非交互绘图
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
desktop = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
rag = ["pypdf>=6,<7", "pymilvus>=3,<3.1", "milvus-lite>=3,<3.1"]
rag-benchmark = ["pyarrow>=17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "desktop_app*", "knowledge*", "folder_assistant*"]

[tool.setuptools.package-data]
agent = ["*.json"]
knowledge = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
