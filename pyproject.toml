[project]
name = "personal-agent"
version = "0.4.0"
description = "从零手写的个人研究助理 Agent（不依赖 LangChain）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "rich>=13.7",
    # Windows 不自带 IANA 时区数据库，zoneinfo 需要这个包
    "tzdata; sys_platform == 'win32'",
    # 阶段 2：搜索与网页读取
    "ddgs>=9.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
